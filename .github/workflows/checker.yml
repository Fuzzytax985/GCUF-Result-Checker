name: GCUF Result Auto-Checker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget curl unzip libxi6 libgconf-2-4 libnss3 fonts-liberation libappindicator3-1 libasound2

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sbase install chromedriver

      - name: Run Scraper
        env:
          GCUF_STUDENT_ID: ${{ secrets.GCUF_STUDENT_ID }}
          GCUF_PASSWORD: ${{ secrets.GCUF_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_ACTIONS: "true"
        run: xvfb-run --auto-servernum python main.py

      - name: Commit and push updated seen_results.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_results.json || true
          git commit -m "chore: update cached results" || true
          git push || true